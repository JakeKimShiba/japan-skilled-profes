<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f7fb" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle pattern motif (rising sun arcs) -->
  <g opacity="0.06" transform="translate(900,480)">
    <circle cx="0" cy="0" r="180" fill="#ef4444" />
    <circle cx="0" cy="0" r="220" fill="none" stroke="#ef4444" stroke-width="18" />
    <circle cx="0" cy="0" r="260" fill="none" stroke="#ef4444" stroke-width="12" />
  </g>

  <!-- Card -->
  <g filter="url(#softShadow)">
    <rect x="80" y="100" rx="20" ry="20" width="1040" height="430" fill="#ffffff" stroke="#e6e8ef" />

    <!-- Title area -->
    <g transform="translate(120,160)">
      <rect x="0" y="-40" width="6" height="200" fill="url(#accent)" rx="3" />
      <text x="24" y="0" font-family="'Noto Sans JP', 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#0f172a">
        일본 고도인재 비자 점수 계산기
      </text>
      <text x="24" y="52" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#334155">
        Japan Highly Skilled Professional Visa Calculator
      </text>
      <text x="24" y="104" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="20" fill="#64748b">
        빠르고 정확한 i18n 지원 · 접근성 강화 · 모바일 친화적 PDF
      </text>
    </g>

    <!-- Points chips -->
    <g transform="translate(120,340)">
      <rect x="0" y="-26" rx="14" ry="14" width="180" height="48" fill="#f1f5f9" />
      <text x="18" y="6" font-family="'Open Sans', Arial" font-size="20" font-weight="600" fill="#0f172a">Education</text>
      <text x="140" y="6" font-family="'Open Sans', Arial" font-size="20" font-weight="700" fill="#2563eb">+30</text>

      <rect x="200" y="-26" rx="14" ry="14" width="200" height="48" fill="#f1f5f9" />
      <text x="218" y="6" font-family="'Open Sans', Arial" font-size="20" font-weight="600" fill="#0f172a">Experience</text>
      <text x="348" y="6" font-family="'Open Sans', Arial" font-size="20" font-weight="700" fill="#2563eb">+20</text>

      <rect x="420" y="-26" rx="14" ry="14" width="210" height="48" fill="#f1f5f9" />
      <text x="438" y="6" font-family="'Open Sans', Arial" font-size="20" font-weight="600" fill="#0f172a">Income</text>
      <text x="548" y="6" font-family="'Open Sans', Arial" font-size="20" font-weight="700" fill="#2563eb">+40</text>

      <rect x="640" y="-26" rx="14" ry="14" width="220" height="48" fill="#f1f5f9" />
      <text x="658" y="6" font-family="'Open Sans', Arial" font-size="20" font-weight="600" fill="#0f172a">University</text>
      <text x="800" y="6" font-family="'Open Sans', Arial" font-size="20" font-weight="700" fill="#16a34a">+10</text>
    </g>

    <!-- Footer -->
    <g transform="translate(900,480)">
      <rect x="-220" y="-46" rx="12" ry="12" width="200" height="44" fill="url(#accent)" />
      <text x="-200" y="-16" font-family="'Open Sans', Arial" font-size="18" font-weight="700" fill="#ffffff">Get your score</text>
    </g>
  </g>
</svg>
